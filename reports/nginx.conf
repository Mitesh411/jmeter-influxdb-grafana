# Serves ./results (JMeter HTML reports, sitespeed.io reports) read-only, with directory listings.
# Grafana and Jenkins link here, e.g. /jmeter/<runId>/html-report/index.html
server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;
    autoindex_exact_size off;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
